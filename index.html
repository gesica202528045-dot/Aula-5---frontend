<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operadores Algébricos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .campo {
            margin-bottom: 12px;
        }

        input, button {
            padding: 8px 12px;
            font-size: 16px;
        }

        button {
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }

        /* CSS: Margens para separar os resultados */
        .resultado-item {
            margin-top: 10px;
            margin-bottom: 10px;
            padding: 10px;
            background-color: #f0f0f0;
            border-left: 4px solid #007bff;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h2>Calculadora de Operações Básicas</h2>

    <!-- HTML: <input type="number"> para os dois valores -->
    <div class="campo">
        <label for="num1">Primeiro valor:</label>
        <input type="number" id="num1" placeholder="Digite o primeiro número">
    </div>

    <div class="campo">
        <label for="num2">Segundo valor:</label>
        <input type="number" id="num2" placeholder="Digite o segundo número">
    </div>

    <!-- HTML: <button> para executar -->
    <button onclick="calcular()">Calcular</button>

    <div id="container-resultados"></div>

    <script>
        function calcular() {
            // Obtém os valores dos inputs
            const n1 = parseFloat(document.getElementById('num1').value);
            const n2 = parseFloat(document.getElementById('num2').value);
            const container = document.getElementById('container-resultados');

            // Validação simples
            if (isNaN(n1) || isNaN(n2)) {
                container.innerHTML = '<p style="color: red; margin-top: 15px;">Por favor, insira números válidos em ambos os campos.</p>';
                return;
            }

            // JS: Operadores algébricos +, -, *, / e %
            const soma = n1 + n2;
            const subtracao = n1 - n2;
            const multiplicacao = n1 * n2;
            const divisao = n2 !== 0 ? (n1 / n2) : 'Divisão por zero não permitida';
            const resto = n2 !== 0 ? (n1 % n2) : 'Não é possível calcular resto com divisor zero';

            // Exibe os resultados no elemento HTML
            container.innerHTML = `
                <div class="resultado-item"><strong>Soma:</strong> ${soma}</div>
                <div class="resultado-item"><strong>Subtração:</strong> ${subtracao}</div>
                <div class="resultado-item"><strong>Multiplicação:</strong> ${multiplicacao}</div>
                <div class="resultado-item"><strong>Divisão:</strong> ${divisao}</div>
                <div class="resultado-item"><strong>Resto da divisão:</strong> ${resto}</div>
            `;
        }
    </script>

</body>
</html>
